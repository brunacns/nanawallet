name: Publicar no GitHub Pages

# Publica o conteúdo de src/ (o mesmo HTML/CSS/JS que o Tauri já serve pro
# Desktop, sem nenhum passo de build) direto na raiz do site — por isso
# index.html continua encontrando ./css/... e ./js/... normalmente.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
